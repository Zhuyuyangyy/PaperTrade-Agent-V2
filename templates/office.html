<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>交易台办公室</title>
<style>
  :root{
    --bg:#0a0d13; --panel:#121824; --panel2:#161d2b; --line:#212a3a;
    --ink:#e8eef7; --dim:#8794a8; --dim2:#5d6b80;
    --up:#ff5c5c; --down:#22c55e; --warn:#f0a020; --idle:#3a4457;
    --accent:#6366f1;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font:14px/1.55 "Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:1440px;margin:0 auto;padding:18px 20px 34px}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
  .brand{display:flex;align-items:baseline;gap:10px}
  h1{margin:0;font-size:19px;font-weight:650;letter-spacing:.2px}
  .sub{color:var(--dim2);font-size:12px}
  .stats{margin-left:auto;display:flex;gap:22px}
  .stat{text-align:right}
  .stat b{display:block;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
  .stat span{font-size:11px;color:var(--dim2)}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--down);
       box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulse 2.4s infinite}
  .dot.bad{background:var(--up);animation:none}
  @keyframes pulse{70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}

  /* ---------- wallets ---------- */
  .sec-title{font-size:12px;color:var(--dim2);letter-spacing:.6px;margin:0 0 10px 2px;
             text-transform:uppercase;font-weight:600}
  .wallets{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:12px}
  .card{background:linear-gradient(180deg,var(--panel2),var(--panel));
        border:1px solid var(--line);border-radius:14px;padding:14px 15px 12px;
        position:relative;overflow:hidden;transition:border-color .25s,transform .25s}
  .card:hover{border-color:#2f3d52;transform:translateY(-2px)}
  .card.lead{border-color:#3f4d6b;box-shadow:0 0 0 1px rgba(99,102,241,.18),0 10px 26px -18px rgba(99,102,241,.9)}
  .card.bad{opacity:.62}
  .rank{position:absolute;top:12px;right:12px;font-size:10px;color:var(--dim2);
        border:1px solid var(--line);border-radius:20px;padding:1px 7px}
  .card.lead .rank{color:#a5b4fc;border-color:#39456b}
  .wname{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
  .tagdot{width:6px;height:6px;border-radius:50%;background:var(--idle)}
  .weq{font-size:27px;font-weight:650;letter-spacing:-.6px;font-variant-numeric:tabular-nums;
       margin:7px 0 1px}
  .wdelta{font-size:12px;font-variant-numeric:tabular-nums;margin-bottom:9px}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--dim)}
  .spark{width:100%;height:34px;display:block;margin:2px 0 10px}
  .wgrid{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;font-size:11.5px;color:var(--dim2)}
  .wgrid b{color:var(--ink);font-weight:550;font-variant-numeric:tabular-nums}
  .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px}
  .chip{font-size:10px;background:#1a2231;border:1px solid #222c3d;color:var(--dim);
        border-radius:5px;padding:1px 6px}
  .holds{margin-top:8px;padding-top:7px;border-top:1px solid #1b2331;font-size:11px;color:var(--dim2)}

  /* ---------- office ---------- */
  .panel{margin-top:18px;background:linear-gradient(180deg,var(--panel2),var(--panel));
         border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .pbar{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .pbar .t{font-size:13px;font-weight:600}
  .pbar .m{font-size:11.5px;color:var(--dim2)}
  .tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
  .tab{background:#1a2231;border:1px solid #242f41;color:var(--dim);border-radius:8px;
       padding:4px 11px;font-size:11.5px;cursor:pointer;transition:.18s}
  .tab:hover{color:var(--ink);border-color:#33405a}
  .tab.on{background:#29344a;border-color:#46557a;color:#fff}
  svg.office{display:block;width:100%;height:520px;background:radial-gradient(120% 90% at 50% 0%,#141b28,#0b0f16 70%)}
  /* the walk: elements persist, only the transform moves, so the browser
     animates a person crossing the room instead of a redraw popping */
  .av{transition:transform 1.15s cubic-bezier(.34,.05,.2,1)}
  .legend{display:flex;gap:16px;padding:9px 14px;border-top:1px solid var(--line);
          font-size:11px;color:var(--dim2);flex-wrap:wrap}
  .lg{display:inline-flex;align-items:center;gap:6px}
  .sw{width:9px;height:9px;border-radius:50%}

  /* ---------- feed ---------- */
  .feed{margin-top:16px;background:linear-gradient(180deg,var(--panel2),var(--panel));
        border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .fedrow{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid #17202d;
          font-size:12px}
  .fedrow:last-child{border-bottom:0}
  .who{font-size:10px;font-weight:700;letter-spacing:.3px;min-width:52px;text-align:center;
       border-radius:5px;padding:2px 6px;background:#1c2534;color:var(--dim)}
  .who.ok{background:rgba(34,197,94,.12);color:#4ade80}
  .who.err{background:rgba(255,92,92,.13);color:#ff8080}
  .wb{font-size:10.5px;color:var(--dim2);min-width:78px}
  .txt{color:var(--ink);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .when{color:var(--dim2);font-size:11px;min-width:56px;text-align:right}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand"><h1>交易台办公室</h1><span class="sub">纸面交易 · 只读 · 3 秒刷新</span></div>
  <div class="live"><span class="dot" id="dot"></span><span id="live">连接中</span></div>
  <div class="stats">
    <div class="stat"><b id="s-total">—</b><span>五本账合计权益</span></div>
    <div class="stat"><b id="s-lead">—</b><span>当前领先</span></div>
    <div class="stat"><b id="s-closed">—</b><span>累计平仓</span></div>
  </div>
</header>

<h2 class="sec-title">钱包实时对比</h2>
<section class="wallets" id="wallets"></section>

<section class="panel">
  <div class="pbar">
    <span class="t" id="floor-title">办公室</span>
    <span class="m" id="run-info"></span>
    <div class="tabs" id="tabs"></div>
  </div>
  <svg class="office" id="office" viewBox="0 0 1040 520" preserveAspectRatio="xMidYMid meet"></svg>
  <div class="legend">
    <span class="lg"><span class="sw" style="background:#f0a020"></span>正在干活</span>
    <span class="lg"><span class="sw" style="background:#3f4d6b"></span>刚做完（本轮内）</span>
    <span class="lg"><span class="sw" style="background:#ff5c5c"></span>这一步失败</span>
    <span class="lg"><span class="sw" style="background:#3a4457"></span>待命区（本轮没它的活）</span>
    <span class="lg" style="margin-left:auto">HEAD 沿着虚线走 = 当前一轮的进度</span>
  </div>
</section>

<section class="feed">
  <h2 class="sec-title">最近发生了什么</h2>
  <div id="feed"></div>
</section>
</div>

<script>
const ORDER=["SEARCH","RISK","GMGN","JUDGE","FOMO","EXIT"];
// Desks snake through the room in pipeline order: top row left to right,
// bottom row right to left, so the dotted line never crosses itself.
const D={
  SEARCH:{x:215,y:150,n:"SEARCH"}, RISK:{x:520,y:150,n:"RISK"}, GMGN:{x:825,y:150,n:"GMGN"},
  JUDGE:{x:825,y:380,n:"JUDGE"},   FOMO:{x:520,y:380,n:"FOMO"}, EXIT:{x:215,y:380,n:"EXIT"}
};
const LOUNGE={x:520,y:492};
const HUE={SEARCH:"#38bdf8",RISK:"#a78bfa",GMGN:"#34d399",JUDGE:"#fbbf24",FOMO:"#fb7185",EXIT:"#60a5fa"};
const WCOL=["#38bdf8","#a78bfa","#34d399","#fbbf24","#fb7185","#60a5fa"];
let current=null, state=null;

const cut=(s,n)=>{s=String(s||"");return s.length>n?s.slice(0,n)+"…":s;};
const cls=v=>v>0?"up":(v<0?"down":"flat");
const sg=v=>(v>0?"+":"")+v.toFixed(2);
const ago=ms=>{if(!ms)return"—";const s=(Date.now()-ms)/1000;
  return s<60?Math.round(s)+"秒前":s<3600?Math.round(s/60)+"分前":(s/3600).toFixed(1)+"小时前";};
function wrap(s,per,rows){s=String(s||"");const out=[];
  for(let i=0;i<rows;i++){const p=s.slice(i*per,(i+1)*per);
    if(!p)break; if(i===rows-1&&s.length>rows*per){out.push(p.slice(0,per-1)+"…");break;}
    out.push(p);} return out;}

function sparkline(hist,up){
  if(!hist||hist.length<2) return "";
  const w=200,h=34,pad=2;
  const ys=hist.map(p=>p[1]);
  const lo=Math.min(...ys), hi=Math.max(...ys), span=(hi-lo)||1;
  const pts=hist.map((p,i)=>[pad+i*(w-2*pad)/(hist.length-1), h-pad-((p[1]-lo)/span)*(h-2*pad)]);
  const line=pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const area=pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")+` ${w-pad},${h-pad} ${pad},${h-pad}`;
  const c=up?"#ff5c5c":"#22c55e";
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="g${up?1:0}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${c}" stop-opacity=".28"/>
      <stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
    <polygon points="${area}" fill="url(#g${up?1:0})"/>
    <polyline points="${line}" fill="none" stroke="${c}" stroke-width="1.4" stroke-linejoin="round"/>
  </svg>`;
}

function renderWallets(){
  const sorted=[...state.wallets].filter(w=>!w.unavailable).sort((a,b)=>b.equity-a.equity);
  document.getElementById("s-total").textContent = state.wallets.reduce((a,b)=>a+(b.equity||0),0).toFixed(0);
  document.getElementById("s-lead").textContent = sorted[0]? sorted[0].label.slice(0,9)+" "+sorted[0].equity.toFixed(0) : "—";
  document.getElementById("s-closed").textContent = state.wallets.reduce((a,b)=>a+(b.closed||0),0);
  const order=state.wallets;
  document.getElementById("wallets").innerHTML = order.map((w,wi)=>{
    if(w.unavailable) return `<div class="card bad"><div class="wname"><span class="tagdot"></span>${w.label}</div>
      <div class="weq flat">—</div><div class="wdelta flat">账本瞬间被占用，3 秒后重试</div></div>`;
    const rank = sorted.findIndex(s=>s.file===w.file)+1;
    const up = (w.pnl_vs_start||0) >= 0;
    const arrow = up?"▲":"▼";
    return `<div class="card ${rank===1?"lead":""}">
      <div class="rank">#${rank||"—"}</div>
      <div class="wname"><span class="tagdot" style="background:${WCOL[wi%WCOL.length]}"></span>${w.label}
        <span style="color:var(--dim2);font-weight:400;font-size:11px">${w.closed} 笔</span></div>
      <div class="weq">${(w.equity||0).toFixed(2)}</div>
      <div class="wdelta ${cls(w.pnl_vs_start||0)}">${arrow} ${sg(w.pnl_vs_start||0)} (${(w.pnl_pct||0).toFixed(2)}%) · 起始 1000</div>
      ${sparkline(w.history, up)}
      <div class="wgrid">
        <span>持仓 <b>${w.open}</b></span><span>浮盈 <b class="${cls(w.unrealized||0)}">${sg(w.unrealized||0)}</b></span>
        <span>毛利 <b class="${cls(w.gross||0)}">${sg(w.gross||0)}</b></span><span>已实现 <b class="${cls(w.realized_net||0)}">${sg(w.realized_net||0)}</b></span>
      </div>
      <div class="chips">${Object.entries(w.reasons||{}).map(([k,v])=>`<span class="chip">${k}×${v}</span>`).join("")||'<span class="chip">尚无平仓</span>'}</div>
      <div class="holds">${cut((w.positions||[]).map(p=>`${p.symbol} ${p.pct>=0?"+":""}${p.pct}%`).join(" · ")||"空仓",44)}</div>
    </div>`;
  }).join("");
}

function renderFeed(){
  document.getElementById("feed").innerHTML = (state.feed||[]).map(e=>{
    const wcls = e.kind==="trade" ? (e.ok?"ok":"err") : (e.ok?"":"err");
    return `<div class="fedrow">
      <span class="who ${wcls}">${e.who}</span>
      <span class="wb">${e.wallet}</span>
      <span class="txt">${cut(e.text,72)}</span>
      <span class="when">${ago(e.ms)}</span></div>`;
  }).join("") || '<div class="fedrow"><span class="txt">暂无事件</span></div>';
}

function renderTabs(){
  const tabs=document.getElementById("tabs");
  tabs.innerHTML=state.wallets.filter(w=>!w.unavailable&&w.run_id)
    .map(w=>`<button class="tab ${w.file===current?"on":""}" data-file="${w.file}">${w.label}</button>`).join("");
  tabs.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{current=b.dataset.file;draw();renderTabs();});
}

/* ---------- the room ---------- */
function room(){
  let s="";
  s+=`<rect x="18" y="14" width="1004" height="492" rx="18" fill="#101724" stroke="#1d2635"/>`;
  for(let x=40;x<1010;x+=34) for(let y=34;y<500;y+=34)
    s+=`<circle cx="${x}" cy="${y}" r="1" fill="#182130"/>`;
  s+=`<ellipse cx="520" cy="268" rx="335" ry="152" fill="#141d2c" opacity=".8"/>
      <ellipse cx="520" cy="268" rx="335" ry="152" fill="none" stroke="#1f2b3e"/>`;
  s+=plant(64,58)+plant(968,58)+plant(64,466);
  s+=`<g><rect x="906" y="428" width="34" height="62" rx="7" fill="#1b2434" stroke="#26324a"/>
      <rect x="914" y="438" width="18" height="26" rx="4" fill="#2b6cb0" opacity=".5"/></g>`;
  s+=`<g><rect x="336" y="468" width="152" height="34" rx="11" fill="#1c2637" stroke="#26324a"/>
      <rect x="342" y="460" width="62" height="14" rx="7" fill="#243149"/>
      <rect x="418" y="460" width="62" height="14" rx="7" fill="#243149"/></g>`;
  s+=`<text x="520" y="522" text-anchor="middle" fill="#4d5a70" font-size="10">待命区 · 本轮没活的 agent 在这儿</text>`;
  return s;
}
function plant(x,y){
  return `<g><circle cx="${x}" cy="${y}" r="15" fill="#16351f"/><circle cx="${x-9}" cy="${y-8}" r="9" fill="#1c4429"/>
    <circle cx="${x+9}" cy="${y-6}" r="8" fill="#1a3d25"/><rect x="${x-9}" y="${y+10}" width="18" height="18" rx="4" fill="#20304a"/></g>`;
}
function deskShell(a){
  const d=D[a];
  return `<g>
    <rect x="${d.x-96}" y="${d.y-10}" width="192" height="12" rx="6" fill="#1e2839"/>
    <rect x="${d.x-96}" y="${d.y+2}" width="192" height="46" rx="8" fill="#16202f" stroke="#26324a"/>
    <rect x="${d.x-34}" y="${d.y-44}" width="68" height="34" rx="4" fill="#0d1420" stroke="#2b364d"/>
    <rect id="mon-${a}" x="${d.x-30}" y="${d.y-40}" width="60" height="26" rx="2" fill="#1b2331" opacity=".4"/>
    <rect x="${d.x-4}" y="${d.y-10}" width="8" height="10" fill="#26324a"/>
    <rect x="${d.x-26}" y="${d.y+2}" width="52" height="7" rx="3" fill="#223049"/>
    <text x="${d.x}" y="${d.y+30}" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="700">${a}</text>
    <text x="${d.x}" y="${d.y+43}" text-anchor="middle" fill="#5d6b80" font-size="9">${cut(state.agent_jobs[a]||"",20)}</text>
  </g>`;
}
function avatarShell(a,i){
  const hue=HUE[a];
  return `<g class="av" id="av-${a}" style="transform:translate(${LOUNGE.x-150+i*60}px,${LOUNGE.y}px)">
    <ellipse cx="0" cy="20" rx="13" ry="4" fill="#000" opacity=".3"/>
    <g id="bb-${a}"></g>
    <rect id="bd-${a}" x="-9" y="2" width="18" height="18" rx="7" fill="#3a4457"/>
    <circle cx="0" cy="-6" r="9" fill="${hue}" stroke="#0b0f16" stroke-width="2"/>
    <circle cx="-3" cy="-7" r="1.2" fill="#0b0f16"/><circle cx="3" cy="-7" r="1.2" fill="#0b0f16"/>
    <text y="25" text-anchor="middle" fill="#8794a8" font-size="8.5">${a}</text>
  </g>`;
}
function bubbleSVG(a,lines){
  const g=document.getElementById("bb-"+a); if(!g) return;
  if(!lines.length){ g.innerHTML=""; return; }
  const h=18+lines.length*13;
  g.innerHTML = `<rect x="-100" y="-76" width="200" height="${h}" rx="9" fill="#0c1320" stroke="#2b364d" opacity=".97"/>`
    + lines.map((l,k)=>`<text x="0" y="${-60+k*13}" text-anchor="middle" fill="#cbd5e1" font-size="9.5">${esc(l)}</text>`).join("");
}
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function buildRoom(){
  const d="M"+ORDER.map(a=>`${D[a].x} ${D[a].y+58}`).join(" L ");
  document.getElementById("office").innerHTML = room()
    + `<path id="pipe" d="${d}" fill="none" stroke="#2b364d" stroke-width="2" stroke-dasharray="5 7" opacity=".85"/>`
    + ORDER.map(deskShell).join("")
    + ORDER.map(avatarShell).join("")
    + `<circle id="head" r="6" fill="#a5b4fc" opacity=".95"/>`;
}

function draw(){
  const w=state.wallets.find(x=>x.file===current)||state.wallets.find(x=>x.run_id)||state.wallets[0];
  if(!w) return;
  if(!document.getElementById("av-SEARCH")) buildRoom();
  document.getElementById("floor-title").textContent="办公室 · "+w.label;
  document.getElementById("run-info").textContent =
    w.run_id? `第 ${w.run_id} 轮 · ${ago(w.finished_ms||w.started_ms)}` : "该账本不做流水线（纯 Desk）";
  const steps=w.steps||{};
  ORDER.forEach((a,i)=>{
    const st=steps[a];
    const d=D[a];
    const target = st ? {x:d.x, y:d.y+72} : {x:LOUNGE.x-150+i*60, y:LOUNGE.y};
    const av=document.getElementById("av-"+a);
    if(av) av.style.transform=`translate(${target.x}px,${target.y}px)`;
    const mon=document.getElementById("mon-"+a);
    const bd=document.getElementById("bd-"+a);
    const colour = !st ? "#3a4457" : (st.ok ? (((Date.now()-st.decided_at_ms)>150000) ? "#3f4d6b" : "#f0a020") : "#ff5c5c");
    if(mon){ mon.setAttribute("fill", !st?"#1b2331":colour);
      mon.setAttribute("opacity", st?".92":".4"); }
    if(bd) bd.setAttribute("fill", colour);
    bubbleSVG(a, st?wrap(st.summary,25,2):[]);
  });
  runHead();
}

let headT=0;
function runHead(){
  const path=document.getElementById("pipe"), head=document.getElementById("head");
  if(!path||!head||!path.getTotalLength) return;
  if(runHead._i) return;                       // start it once
  const len=path.getTotalLength();
  runHead._i=setInterval(()=>{
    headT=(headT+len/320)%len;
    const pt=path.getPointAtLength(headT);
    head.setAttribute("cx",pt.x); head.setAttribute("cy",pt.y);
  },33);
}

async function tick(){
  try{
    const r=await fetch("/api/state",{cache:"no-store"});
    state=await r.json();
    if(!current){const f=state.wallets.find(w=>w.run_id); if(f) current=f.file;}
    document.getElementById("live").textContent="实时 "+new Date().toLocaleTimeString();
    document.getElementById("dot").className="dot";
    renderWallets(); renderTabs(); renderFeed(); draw();
  }catch(e){
    document.getElementById("live").textContent="连接失败";
    document.getElementById("dot").className="dot bad";
  }
}
tick(); setInterval(tick,3000);
</script>
</body>
</html>
