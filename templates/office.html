<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>交易台办公室 · 钱包实时对比</title>
<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --line:#242c38; --ink:#e6edf3; --dim:#8b949e;
    --up:#f85149; --down:#3fb950; --warn:#d29922; --idle:#30363d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  header{display:flex;align-items:baseline;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:17px;font-weight:600}
  .sub{color:var(--dim);font-size:12px}
  .live{color:var(--down);font-size:12px}

  /* ---- wallets ---- */
  .wallets{display:flex;gap:12px;padding:14px 18px;overflow-x:auto}
  .wallet{min-width:210px;flex:1;background:var(--panel);border:1px solid var(--line);
          border-radius:10px;padding:12px 14px;position:relative}
  .wallet.lead{outline:1px solid #3d4b5e}
  .wname{font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center}
  .tag{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:1px 7px}
  .weq{font-size:24px;font-weight:600;margin:6px 0 2px;letter-spacing:-.5px}
  .wpnl{font-size:12px;margin-bottom:8px}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--dim)}
  .wgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:11px;color:var(--dim)}
  .wgrid b{color:var(--ink);font-weight:500}
  .chips{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px}
  .chip{font-size:10px;background:#1c2230;border-radius:4px;padding:1px 6px;color:var(--dim)}
  .holds{margin-top:8px;font-size:11px;color:var(--dim);border-top:1px solid var(--line);padding-top:6px}

  /* ---- office ---- */
  .floor{margin:6px 18px 18px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .floorbar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim)}
  .tabs{display:flex;gap:6px;margin-left:auto}
  .tab{background:#1c2230;border:1px solid var(--line);color:var(--dim);border-radius:6px;
       padding:3px 10px;font-size:11px;cursor:pointer}
  .tab.on{background:#293241;border-color:#4b5b70;color:var(--ink)}
  svg{display:block;width:100%;height:460px;background:#10151d}
  .desk{fill:#1a2130;stroke:#2a3546;stroke-width:1}
  .desklabel{fill:#c9d1d9;font-size:11px;font-weight:600}
  .deskjob{fill:#6e7681;font-size:9px}
  .floorline{stroke:#1c2531;stroke-width:1}
  .avatar{transition:transform 1.1s cubic-bezier(.4,.1,.3,1)}
  .body{fill:#2f81f7;stroke:#0e1117;stroke-width:2}
  .body.busy{fill:#f0883e}
  .body.err{fill:#f85149}
  .body.idle{fill:#484f58}
  .aname{fill:#0e1117;font-size:9px;font-weight:700;text-anchor:middle}
  .bubble{fill:#0e1117;stroke:#30363d}
  .bubbletext{fill:#c9d1d9;font-size:9px}
  .pulse{fill:#f0883e;opacity:.9}
</style>
</head>
<body>
<header>
  <h1>交易台办公室</h1>
  <span class="sub">纸面交易 · 只读 · 每 3 秒刷新</span>
  <span class="live" id="live">● 连接中</span>
</header>

<section class="wallets" id="wallets"></section>

<section class="floor">
  <div class="floorbar">
    <span id="floor-title">办公室</span>
    <span id="run-info"></span>
    <div class="tabs" id="tabs"></div>
  </div>
  <svg id="office" viewBox="0 0 900 460" preserveAspectRatio="xMidYMid meet"></svg>
</section>

<script>
const ORDER = ["SEARCH","RISK","GMGN","JUDGE","FOMO","EXIT"];
// Desk coordinates on the floor; the walk between them is the pipeline.
const DESKS = {
  SEARCH:{x:110,y:110}, RISK:{x:300,y:110}, GMGN:{x:490,y:110},
  JUDGE:{x:680,y:110}, FOMO:{x:300,y:300}, EXIT:{x:620,y:300}
};
const IDLE = {x:450, y:395};
let current = null;   // selected ledger
let state = null;

function cls(v){ return v>0?"up":(v<0?"down":"flat"); }
function money(v){ return (v>=0?"+":"") + v.toFixed(2); }
function ago(ms){ if(!ms) return "—"; const s=(Date.now()-ms)/1000;
  return s<60?Math.round(s)+"秒前":s<3600?Math.round(s/60)+"分钟前":(s/3600).toFixed(1)+"小时前"; }
function cut(s,n){ s=String(s||""); return s.length>n?s.slice(0,n)+"…":s; }

function renderWallets(){
  const box=document.getElementById("wallets");
  const best=state.wallets.reduce((a,b)=>(b.equity>(a?.equity??-1e9)?b:a),null);
  box.innerHTML = state.wallets.map(w=>{
    if(w.unavailable) return `<div class="wallet"><div class="wname">${w.label}</div>
      <div class="weq flat">读取中…</div><div class="wgrid"><span>账本短暂不可用</span></div></div>`;
    const p=w.pnl_vs_start||0;
    const holds=(w.positions||[]).map(p=>`${p.symbol} ${p.pct>=0?"+":""}${p.pct}%`).join(" · ")||"空仓";
    return `<div class="wallet ${w===best?"lead":""}">
      <div class="wname">${w.label}<span class="tag">${w.closed} 笔平仓</span></div>
      <div class="weq">${w.equity.toFixed(2)}</div>
      <div class="wpnl ${cls(p)}">${money(p)} (${w.pnl_pct>=0?"+":""}${w.pnl_pct}%) · 起始 1000</div>
      <div class="wgrid">
        <span>持仓 <b>${w.open}</b></span><span>浮盈 <b>${money(w.unrealized||0)}</b></span>
        <span>毛利 <b>${money(w.gross||0)}</b></span><span>已实现 <b>${money(w.realized_net||0)}</b></span>
      </div>
      <div class="chips">${Object.entries(w.reasons||{}).map(([k,v])=>`<span class="chip">${k}×${v}</span>`).join("")}</div>
      <div class="holds">${cut(holds,46)}</div>
    </div>`;
  }).join("");
}

function renderTabs(){
  const tabs=document.getElementById("tabs");
  tabs.innerHTML = state.wallets.filter(w=>!w.unavailable && w.run_id)
    .map(w=>`<button class="tab ${w.file===current?"on":""}" data-file="${w.file}">${w.label}</button>`).join("");
  tabs.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{current=b.dataset.file;draw();renderTabs();});
}

function desk(x,y,name,job){
  return `<g>
    <rect class="desk" x="${x-70}" y="${y-16}" width="140" height="52" rx="6"/>
    <text class="desklabel" x="${x}" y="${y+6}" text-anchor="middle">${name}</text>
    <text class="deskjob" x="${x}" y="${y+22}" text-anchor="middle">${job}</text>
  </g>`;
}

function draw(){
  const w = state.wallets.find(x=>x.file===current) || state.wallets[0];
  if(!w) return;
  document.getElementById("floor-title").textContent = `办公室 · ${w.label}`;
  document.getElementById("run-info").textContent =
    w.run_id ? `第 ${w.run_id} 轮 · ${ago(w.finished_ms||w.started_ms)}` : "无轮次记录";
  const svg=document.getElementById("office");
  // Floor grid
  let grid="";
  for(let x=0;x<=900;x+=45) grid+=`<line class="floorline" x1="${x}" y1="0" x2="${x}" y2="460"/>`;
  for(let y=0;y<=460;y+=45) grid+=`<line class="floorline" x1="0" y1="${y}" x2="900" y2="${y}"/>`;
  // The conveyor: the order the work passes through.
  let path="";
  for(let i=0;i<ORDER.length-1;i++){
    const a=DESKS[ORDER[i]], b=DESKS[ORDER[i+1]];
    path+=`<line x1="${a.x}" y1="${a.y+40}" x2="${b.x}" y2="${b.y+40}" stroke="#212c3a" stroke-width="2" stroke-dasharray="4 5"/>`;
  }
  let desksHTML = ORDER.map(a=>desk(DESKS[a].x,DESKS[a].y,a,cut(state.agent_jobs[a]||"",22))).join("");
  // Coffee corner: where an agent stands when it has nothing to do.
  desksHTML += `<g><circle cx="${IDLE.x}" cy="${IDLE.y}" r="26" fill="#161d28" stroke="#212c3a"/>
    <text x="${IDLE.x}" y="${IDLE.y+4}" text-anchor="middle" fill="#6e7681" font-size="9">待命区</text></g>`;

  let avatars="";
  for(const a of ORDER){
    const st=(w.steps||{})[a];
    const home=DESKS[a];
    const busy = st && (w.finished_ms==null || (Date.now()-st.decided_at_ms)<120000);
    const pos = st? home : IDLE;
    const jitter = (a.charCodeAt(0)%7)*6;
    const px = pos.x + (st? jitter-18 : (a.charCodeAt(1)%5)*22-44);
    const py = pos.y + (st? 34 : 20);
    const cls2 = !st?"idle":(st.ok?(busy?"busy":""):"err");
    const bubble = st? `<g><rect class="bubble" x="${px-78}" y="${py-46}" width="156" height="30" rx="6"/>
      <text class="bubbletext" x="${px}" y="${py-27}" text-anchor="middle">${cut(st.summary,34)}</text></g>`:"";
    avatars += `<g class="avatar" transform="translate(${px},${py})">
      ${bubble}
      <circle class="body ${cls2}" r="15"/>
      ${busy?`<circle class="pulse" r="19" opacity=".35"/>`:""}
      <text class="aname" y="4">${a.slice(0,4)}</text>
    </g>`;
  }
  svg.innerHTML = grid + path + desksHTML + avatars;
}

async function tick(){
  try{
    const r=await fetch("/api/state",{cache:"no-store"});
    state=await r.json();
    if(!current){ const first=state.wallets.find(w=>w.run_id); if(first) current=first.file; }
    document.getElementById("live").textContent="● 实时 "+new Date().toLocaleTimeString();
    renderWallets(); renderTabs(); draw();
  }catch(e){
    document.getElementById("live").textContent="● 连接失败";
  }
}
tick(); setInterval(tick,3000);
</script>
</body>
</html>
